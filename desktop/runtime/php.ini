; PHP settings for the BMPC desktop app (bundled PHP, offline mode).
;
; The launcher adds machine-specific paths on the command line:
; extension_dir, opcache.file_cache, curl.cainfo, openssl.cafile,
; sys_temp_dir, upload_tmp_dir and error_log.

[PHP]
engine = On
short_open_tag = Off
expose_php = Off
memory_limit = 512M
; PDF/Excel report generation can take a while on large data sets.
max_execution_time = 300
max_input_time = 120
max_input_vars = 5000

error_reporting = E_ALL & ~E_DEPRECATED
display_errors = Off
display_startup_errors = Off
log_errors = On

; Uploads: validated at 20 MB per file, several files per progress update.
file_uploads = On
upload_max_filesize = 25M
post_max_size = 100M
max_file_uploads = 20

; "E" first so Laravel sees the launcher's environment variables in $_ENV.
variables_order = "EGPCS"
request_order = "GP"
default_charset = "UTF-8"
date.timezone = Asia/Manila

realpath_cache_size = 4096K
realpath_cache_ttl = 600

extension = curl
extension = fileinfo
extension = gd
extension = intl
extension = mbstring
; exif must load after mbstring
extension = exif
extension = openssl
extension = pdo_mysql
extension = pdo_sqlite
extension = sodium
extension = sqlite3
extension = zip
zend_extension = opcache

[Session]
session.use_strict_mode = 1
session.cookie_httponly = 1

[opcache]
opcache.enable = 1
; artisan commands are separate processes; the file cache lets them share compiled code.
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
