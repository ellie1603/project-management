<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0c2d6b">
    <title>You're offline | BMPC</title>
    <style>
        :root { color-scheme: light dark; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f4f5; color: #18181b; }
        .card { max-width: 380px; width: 100%; background: #fff; border: 1px solid #e4e4e7; border-radius: 20px; padding: 32px 28px; text-align: center; }
        img { width: 72px; height: 72px; border-radius: 16px; }
        h1 { font-size: 20px; margin: 16px 0 8px; }
        p { font-size: 14px; line-height: 1.6; color: #52525b; margin: 0; }
        button { margin-top: 24px; width: 100%; border: 0; border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 600; color: #fff; background: #0c2d6b; cursor: pointer; }
        @media (prefers-color-scheme: dark) {
            body { background: #0a0a0b; color: #f4f4f5; }
            .card { background: #151517; border-color: #2c2c30; }
            p { color: #a1a1aa; }
            button { background: #52525b; }
        }
    </style>
</head>
<body>
    <main class="card">
        <img src="/icons/icon-192.png" alt="BMPC">
        <h1>You're offline</h1>
        <p>BMPC Project Management needs an internet connection. Nothing you saved is lost. Check your Wi-Fi or mobile data, then try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
